on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
      - name: Install
        shell: cmd
        run: |
          conda install -y cmake swig ninja scipy scikit-learn pandas matplotlib-base pydot
      - name: Debug
        shell: cmd
        run: |
          python -c "import pandas; print(pandas.__file__)"
          echo "nope"
          dir /p C:\Users\runneradmin\miniconda3\
          dir /p C:\Users\runneradmin\miniconda3\Lib
          dir /p C:\Users\runneradmin\miniconda3\Lib\site-packages

      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: cmd
        run: |
          set "LIB=C:\Users\runneradmin\miniconda3\Library\lib;%LIB%"
          set "INCLUDE=C:\Users\runneradmin\miniconda3\Library\include;%INCLUDE%"
          cmake -G Ninja -B . -LAH ^
           -DCMAKE_INSTALL_PREFIX="C:/Users/runneradmin/miniconda3/Library" ^
           -DCMAKE_PREFIX_PATH="C:/Users/runneradmin/miniconda3/Library" ^
           -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /W3 /GR /EHsc" ^
           -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=8 ^
           -DBUILD_SHARED_LIBS=OFF -DAGRUM_INLINE=ON ^
           -DINSTALL_PYTHONDIR="C:/Users/runneradmin/miniconda3/Lib/site-packages" ^
           -DPython_FIND_STRATEGY=LOCATION -DPython_ROOT_DIR="C:/Users/runneradmin/miniconda3" -DBUILD_PYTHON=ON -DAGRUM_PYTHON_SABI=OFF || exit 1
          cmake --build . --target install --parallel 4 --verbose || exit 1
          C:\Users\runneradmin\miniconda3\python.exe \mingw_test.py
          echo "youpi"
          ctest --output-on-failure --timeout 100 -j2 --repeat after-timeout:2 --schedule-random

